# Attract/demo overlay only: sprite21 plaque and its blinking press-start
# message. The second branch displays press-start without the plaque.
# Start before the blink branch so the plaque remains tagged on hidden-text
# frames too. Do not tag the shared font or sprite renderers themselves.
[[patches.hook]]
func = "func_80022E08"
before_vram = 0x800231B8
text = "wetrix_background_marker(rdram, 12);"

[[patches.hook]]
func = "func_80022E08"
